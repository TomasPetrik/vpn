[package]
name = "wstunnel_ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# staticlib = iOS XCFramework; cdylib = Android jniLibs (.so)
crate-type = ["staticlib", "cdylib"]
name = "wstunnel_ffi"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
url = "2"
once_cell = "1"
rustls-pki-types = "1"
# Pin to same release as VPS binary 10.5.2; use ring (lighter than aws-lc on iOS).
wstunnel = { path = "../vendor/wstunnel-10.5.2/wstunnel", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = "symbols"
