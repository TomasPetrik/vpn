<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign in | PetrikVPN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Matches RadarCut admin login (app/admin/login/page.tsx + globals.css tokens) */
    :root {
      --background: #fafaf8;
      --foreground: #111111;
      --card: #ffffff;
      --muted-foreground: #6b6b6b;
      --primary: #111111;
      --primary-foreground: #ffffff;
      --border: #e8e8e5;
      --input: #e8e8e5;
      --ring: #111111;
      --cta-hover: #2a2a2a;
      --destructive: #b42318;
      --radius: 0.75rem;
      --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
      --font-heading: "Manrope", "Inter", ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      font-family: var(--font-sans);
      font-size: 14px;
      background: rgb(243 243 240 / 0.3); /* muted/30 */
      color: var(--foreground);
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 24rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow: hidden;
      border-radius: calc(var(--radius) + 0.15rem);
      background: var(--card);
      outline: 1px solid rgb(17 17 17 / 0.1);
      box-shadow: 0 1px 2px rgb(17 17 17 / 0.04);
      padding: 1rem 0;
    }
    .header {
      display: grid;
      gap: .25rem;
      padding: 0 1rem;
      text-align: center;
      justify-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-family: var(--font-heading);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand-mark { width: 1.5rem; height: 1.5rem; color: var(--primary); }
    h1 {
      margin: 0;
      font-family: var(--font-heading);
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .desc { margin: 0; color: var(--muted-foreground); font-size: .875rem; }
    .content { padding: 0 1rem; }
    form { display: flex; flex-direction: column; gap: 1rem; }
    .field { display: flex; flex-direction: column; gap: .375rem; }
    label { font-size: .875rem; font-weight: 500; }
    input {
      height: 2rem;
      width: 100%;
      padding: .25rem .625rem;
      border: 1px solid var(--input);
      border-radius: .5rem;
      background: transparent;
      font: inherit;
      outline: none;
    }
    input:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 3px rgb(17 17 17 / 0.2);
    }
    button {
      margin-top: .5rem;
      height: 2rem;
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: var(--primary-foreground);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--cta-hover); }
    .error {
      margin: 0;
      padding: .65rem .75rem;
      border-radius: .65rem;
      background: rgb(180 35 24 / 0.08);
      color: var(--destructive);
      font-size: .875rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="4" fill="currentColor"/>
        </svg>
        PetrikVPN Admin
      </div>
      <h1>Sign in</h1>
      <p class="desc">Use your admin credentials to continue.</p>
    </div>
    <div class="content">
      <form method="post" action="/admin/login">
        {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit">Sign in</button>
      </form>
    </div>
  </div>
</body>
</html>
