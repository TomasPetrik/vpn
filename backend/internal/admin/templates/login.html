<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PetrikVPN Admin Login</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 3rem auto; max-width: 22rem; }
    input, button { font: inherit; width: 100%; padding: .5rem; margin: .35rem 0; box-sizing: border-box; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>PetrikVPN Admin</h1>
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  <form method="post" action="/admin/login">
    <label>Username <input name="username" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
