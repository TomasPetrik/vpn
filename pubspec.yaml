name: ru_eu_vpn
description: "PetrikVPN — Flutter client for the Petrixon VPN service."
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^16.2.4
  dio: ^5.9.0
  get_it: ^8.2.0
  flutter_secure_storage: ^9.2.4
  device_info_plus: ^12.1.0
  mobile_device_identifier: ^0.0.3
  package_info_plus: ^9.0.0
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  equatable: ^2.0.7
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#0A1C4A"
  adaptive_icon_background: "#0A1C4A"
  adaptive_icon_foreground: assets/branding/app_icon.png
  adaptive_icon_foreground_inset: 16

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
    - assets/branding/header_mark.png
